version: '3.8'

services:
  wordpress:
    image: wordpress
    container_name: wp
    restart: always
    ports:
      - "80:80"
    depends_on:
      - db
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_NAME=eticket_db
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=admin
    networks:
      - eticket-net

  db:
    image: mysql:8.0
    container_name: ticket_booking_db
    restart: always
    environment:
      MYSQL_DATABASE: eticket_db
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - eticket-db-data:/var/lib/mysql
    networks:
      - eticket-net

volumes:
  eticket-db-data:
    external: true

networks:
  eticket-net:
    external: true
