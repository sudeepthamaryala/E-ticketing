apiVersion: apps/v1
kind: Deployment
metadata:
  name: eticket-deployment
  labels:
    app: eticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eticket
  template:
    metadata:
      labels:
        app: eticket
    spec:
      containers:
        - name: eticket-container
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: eticket-service
spec:
  type: NodePort
  selector:
    app: eticket
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
